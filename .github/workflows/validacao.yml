name: Validar Miguelito (sem gerar APK)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Flutter estavel
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar versoes
        run: flutter --version

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar erros Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testar conteudo educativo
        run: flutter test
