
name: Gerar APK Miguelito 1.1.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar ambiente
        run: flutter doctor -v

      - name: Analisar codigo Dart
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Executar testes automatizados
        run: flutter test

      - name: Preparar assinatura de produção
        env:
          KEYSTORE_BASE64: ${{ secrets.MIGUELITO_KEYSTORE_BASE64 }}
          MIGUELITO_STORE_PASSWORD: ${{ secrets.MIGUELITO_STORE_PASSWORD }}
          MIGUELITO_KEY_ALIAS: ${{ secrets.MIGUELITO_KEY_ALIAS }}
          MIGUELITO_KEY_PASSWORD: ${{ secrets.MIGUELITO_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MIGUELITO_STORE_PASSWORD" ] || [ -z "$MIGUELITO_KEY_ALIAS" ] || [ -z "$MIGUELITO_KEY_PASSWORD" ]; then
            echo "::error::Configure os quatro secrets MIGUELITO_* antes de gerar um APK definitivo."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/miguelito-release.jks"
          echo "MIGUELITO_KEYSTORE_PATH=$RUNNER_TEMP/miguelito-release.jks" >> "$GITHUB_ENV"
          echo "MIGUELITO_STORE_PASSWORD=$MIGUELITO_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MIGUELITO_KEY_ALIAS=$MIGUELITO_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MIGUELITO_KEY_PASSWORD=$MIGUELITO_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Gerar APK
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Miguelito-1.1.0-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error
