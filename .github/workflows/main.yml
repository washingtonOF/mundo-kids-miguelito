name: Publicar Miguelzãoo Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: miguelzaoo-pages
  cancel-in-progress: true

jobs:
  validar:
    uses: ./.github/workflows/validacao.yml

  web:
    name: Compilar e publicar Web
    needs: validar
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Instalar dependencias
        run: flutter pub get
      - name: Compilar site Flutter
        run: flutter build web --release --base-href /mundo-kids-miguelito/
      - name: Disponibilizar site compilado
        uses: actions/upload-artifact@v4
        with:
          name: Miguelzaoo-Web
          path: build/web/
          if-no-files-found: error
          retention-days: 30
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar publicacao
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
